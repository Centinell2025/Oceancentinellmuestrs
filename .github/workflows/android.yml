name: OceanCentinell Android demonstration
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'play-store/**'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md' 
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check demonstration data validation
        run: node --test tests/*.cjs tests/*.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install API 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Lint and build Android
        working-directory: android
        run: gradle --no-daemon lintDebug assembleDebug assembleDebugAndroidTest bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: OceanCentinell-Business-1.0.0-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

  android-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OceanCentinell-Business-1.0.0-android
          path: artifacts
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1080x1920
          script: |
            adb install artifacts/outputs/apk/debug/app-debug.apk
            adb install artifacts/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.beaconoftheeagle.oceancentinellbusiness.test/com.beaconoftheeagle.oceancentinellbusiness.SmokeInstrumentation | tee android-smoke.txt
            adb pull /sdcard/Android/data/com.beaconoftheeagle.oceancentinellbusiness/files/screenshots android-screenshots
            adb logcat -d -s chromium AndroidRuntime > android-logcat.txt
            grep -q '^PASS: packaged app loaded' android-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OceanCentinell-Android-tested-screens
          path: |
            android-screenshots/
            android-smoke.txt
            android-logcat.txt
